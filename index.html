<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fill-in Drum Sequencer</title>
    <style>
        :root {
            --bg-color: #121214;
            --panel-color: #1e1e24;
            --accent: #00ff9d;
            --text-main: #eee;
            --text-dim: #888;
            --step-off: #34344f;
            --step-off-alt: #24242b; /* 4ステップごとの代替色を少し調整 */
            --step-on: #00ff9d;
            --step-play: #fff;
            --k-color: #ff0055;
            --s-color: #00ccff;
            --h-color: #ffaa00;
            --p-color: #bd00ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            background-color: var(--panel-color);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            width: 95%;
            max-width: 900px;
            border: 1px solid #333;
        }

        /* Header & Controls */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 { margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #111;
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #333;
        }

        select {
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            min-width: 120px;
        }

        /* Added style for BPM Input */
        input[type=number] {
            background: #222;
            color: var(--accent);
            border: 1px solid #444;
            border-radius: 4px;
            padding: 4px;
            width: 60px;
            font-family: monospace;
            font-weight: bold;
            font-size: 0.9rem;
        }

        button {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 15px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #444; }

        button#playBtn {
            background: var(--accent);
            color: #000;
            border: none;
            width: 80px;
        }
        button#playBtn.playing { background: #ff4444; color: #fff; }

        button#midiBtn {
            background: #bd00ff;
            border: none;
        }

        button#settingsBtn {
            background: #444;
            border: none;
            font-size: 1.1rem;
            padding: 5px 10px;
        }

        /* Volume Slider */
        input[type=range] {
            width: 80px;
            height: 4px;
            background: #444;
            border-radius: 2px;
            -webkit-appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Sequencer Grid */
        .sequencer-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 20px;
            background: #111;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .track {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .track-label {
            width: 60px;
            font-size: 0.75rem;
            font-weight: bold;
            text-align: right;
            padding-right: 10px;
            color: var(--text-dim);
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 4px;
            flex-grow: 1;
            min-width: 300px; /* For mobile scroll */
        }

        .step {
            aspect-ratio: 1;
            background-color: var(--step-off);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        /* 4ステップごとの代替背景色 */
        .step.alt-beat:not(.active) {
            background-color: var(--step-off-alt);
        }

        /* Active/Playing States */
        .step.active { opacity: 0.8; }
        .step.playing { border: 1px solid #fff; z-index: 10; transform: scale(1.1); box-shadow: 0 0 5px #fff; }
        
        /* Instrument Colors */
        .track[data-inst="kick"] .step.active { background-color: var(--k-color); box-shadow: 0 0 5px var(--k-color); }
        .track[data-inst="snare"] .step.active { background-color: var(--s-color); box-shadow: 0 0 5px var(--s-color); }
        .track[data-inst="hat"] .step.active { background-color: var(--h-color); box-shadow: 0 0 5px var(--h-color); }
        .track[data-inst="perc"] .step.active { background-color: var(--p-color); box-shadow: 0 0 5px var(--p-color); }

        /* Modal Styles */
        .modal {
            display: none; 
            position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; overflow: auto;
            background-color: rgba(0,0,0,0.7);
            backdrop-filter: blur(3px);
        }
        .modal-content {
            background-color: var(--panel-color);
            margin: 10% auto; padding: 25px;
            border: 1px solid #444; border-radius: 8px;
            width: 320px; color: var(--text-main);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.2);
        }
        .modal-content h2 {
            margin-top: 0; font-size: 1.2rem; margin-bottom: 20px; text-transform: uppercase;
        }
        .setting-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
            background: #1a1a1a; padding: 8px 12px; border-radius: 4px;
        }
        .setting-row label {
            font-weight: bold; color: var(--text-dim);
        }
        .setting-row input {
            width: 70px; background: #222; color: var(--accent);
            border: 1px solid #444; border-radius: 4px; padding: 6px; text-align: center;
            font-family: monospace; font-weight: bold; font-size: 1rem;
        }
        .modal-close-btn {
            width: 100%; margin-top: 15px; background: #444; padding: 10px;
        }

        .description {
            font-size: 0.85rem;
            color: #aaa;
            background: #252530;
            padding: 10px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        @media (max-width: 700px) {
            header { flex-direction: column; align-items: stretch; }
            .controls { justify-content: center; }
            .track-label { width: 40px; font-size: 0.6rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Fill-in Drum Sequencer</h1>
        <div class="controls">
            <select id="genreSelect"></select>
            <select id="patternSelect"></select>
            
            <div class="control-group">
                <span style="font-size:0.8rem; color:#888;">VOL</span>
                <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.8">
            </div>

            <div class="control-group">
                <span style="font-size:0.8rem; color:#888;">BPM</span>
                <input type="number" id="bpmInput" min="40" max="300" value="120">
            </div>

            <button id="playBtn">PLAY</button>
            <button id="midiBtn" title="Download MIDI File">MIDI DL</button>
            <button id="settingsBtn" title="MIDI Settings">⚙️</button>
        </div>
    </header>

    <div class="sequencer-grid">
        <div class="track" data-inst="hat"><div class="track-label">HiHat</div><div class="steps" id="row-hat"></div></div>
        <div class="track" data-inst="perc"><div class="track-label">FX/Bass</div><div class="steps" id="row-perc"></div></div>
        <div class="track" data-inst="snare"><div class="track-label">Snare</div><div class="steps" id="row-snare"></div></div>
        <div class="track" data-inst="kick"><div class="track-label">Kick</div><div class="steps" id="row-kick"></div></div>
    </div>

    <div class="description" id="descBox">
        Select a genre and pattern. (Total 240+ patterns available)
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h2>MIDI Note Mapping</h2>
    <p style="font-size: 0.8rem; color: #888; margin-bottom: 15px;">Standard: C4 = 60</p>
    <div class="setting-row">
      <label>Kick</label>
      <input type="text" id="map-k" title="e.g. C2, D#2">
    </div>
    <div class="setting-row">
      <label>Snare</label>
      <input type="text" id="map-s" title="e.g. D2">
    </div>
    <div class="setting-row">
      <label>HiHat</label>
      <input type="text" id="map-h" title="e.g. F#2">
    </div>
    <div class="setting-row">
      <label>FX/Bass</label>
      <input type="text" id="map-p" title="e.g. C4">
    </div>
    <button id="closeSettingsBtn" class="modal-close-btn">Close</button>
  </div>
</div>

            { name: "Fast Hats", desc: "32nd note feel hats.", k: "x...x...x...x...", s: "....x.......x...", h: "rrrrrrrrrrrrrrrr", p: "................" },
            { name: "Snare & Tom Mix", desc: "Toms and snares.", k: "x...x...x...x...", s: "....xxxx....xxxx", h: "................", p: "........xxxx...." },
            { name: "Trance Kick Roll", desc: "Fast kicks.", k: "xxxxxxxxxxxxxxxx", s: "................", h: "................", p: "................" },
            { name: "The Anthem Fill", desc: "Massive drop prep.", k: "x...x...x.......", s: "x.x.x.x.xxxxxxxx", h: "................", p: "............x..." }
        ]
    }
};

// --- Audio Engine ---
let audioCtx;
let masterGainNode;
let isPlaying = false;
let currentStep = 0;
let nextNoteTime = 0.0;
let timerID;
let tempo = 120;
let currentKit = 'break';
const scheduleAheadTime = 0.1;

// Global MIDI Mapping
let MIDI_MAP = {
    'k': 36, // C2 (Bass Drum 1)
    's': 38, // D2 (Acoustic Snare)
    'h': 42, // F#2 (Closed Hi Hat)
    'p': 60  // C4 (High Bongo / Perc)
};

const gridMap = { 'hat': 'row-hat', 'perc': 'row-perc', 'snare': 'row-snare', 'kick': 'row-kick' };
const activePattern = { k:[], s:[], h:[], p:[] };

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGainNode = audioCtx.createGain();
        masterGainNode.connect(audioCtx.destination);
        
        // Set initial volume from slider
        const vol = document.getElementById('volSlider').value;
        masterGainNode.gain.value = vol;
    }
    audioCtx.resume();
}

function initGrid() {
    Object.keys(gridMap).forEach(inst => {
        const row = document.getElementById(gridMap[inst]);
        row.innerHTML = '';
        for (let i = 0; i < 16; i++) {
            const step = document.createElement('div');
            step.classList.add('step');
            
            // 4ステップごとに 'alt-beat' クラスを付与して背景色を変える
            if (Math.floor(i / 4) % 2 === 1) {
                step.classList.add('alt-beat');
            }

            step.dataset.idx = i;
            step.dataset.inst = inst;
            step.onclick = () => toggleStep(inst, i);
            row.appendChild(step);
        }
    });
}

function toggleStep(inst, idx) {
    const row = document.getElementById(gridMap[inst]);
    const step = row.children[idx];
    step.classList.toggle('active');
    const key = inst === 'kick' ? 'k' : inst === 'snare' ? 's' : inst === 'hat' ? 'h' : 'p';
    activePattern[key][idx] = step.classList.contains('active') ? 'x' : '.';
}

function loadPatternData(pData) {
    ['k', 's', 'h', 'p'].forEach(key => {
        activePattern[key] = pData[key].split('');
        const inst = key === 'k' ? 'kick' : key === 's' ? 'snare' : key === 'h' ? 'hat' : 'perc';
        const row = document.getElementById(gridMap[inst]);
        Array.from(row.children).forEach((step, i) => {
            step.classList.remove('active');
            if (activePattern[key][i] !== '.') step.classList.add('active');
        });
    });
}

function playSound(inst, time, type) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    // Connect to Master Gain instead of Destination
    osc.connect(gain);
    gain.connect(masterGainNode); 

    if (inst === 'kick') {
        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
        gain.gain.setValueAtTime(1, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
        if (currentKit === 'urban' || currentKit === 'heavy') {
            osc.frequency.exponentialRampToValueAtTime(40, time + 0.5); 
            gain.gain.exponentialRampToValueAtTime(0.01, time + 0.8);
        }
        osc.start(time);
        osc.stop(time + 0.8);
    } else if (inst === 'snare') {
        const bufferSize = audioCtx.sampleRate * 0.5;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'highpass';
        noiseFilter.frequency.value = 800;
        const noiseGain = audioCtx.createGain();
        noise.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(masterGainNode); // Connect noise to master
        const tone = audioCtx.createOscillator();
        const toneGain = audioCtx.createGain();
        tone.connect(toneGain);
        toneGain.connect(masterGainNode); // Connect tone to master

        if (currentKit === 'break' || currentKit === '909') {
            noiseGain.gain.setValueAtTime(0.7, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
            tone.frequency.setValueAtTime(200, time);
            toneGain.gain.setValueAtTime(0.5, time);
            toneGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        } else {
            noiseGain.gain.setValueAtTime(0.8, time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
            tone.frequency.setValueAtTime(300, time);
            tone.frequency.exponentialRampToValueAtTime(150, time + 0.1);
            toneGain.gain.setValueAtTime(0.3, time);
            toneGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
        }
        noise.start(time);
        tone.start(time);
        tone.stop(time + 0.2);
    } else if (inst === 'hat') {
        const bufferSize = audioCtx.sampleRate * 0.1;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 6000;
        const nGain = audioCtx.createGain();
        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(masterGainNode); // Connect to master
        nGain.gain.setValueAtTime(0.3, time);
        nGain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        noise.start(time);
    } else if (inst === 'perc') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, time);
        if (currentKit === 'urban') osc.frequency.setValueAtTime(60, time);
        osc.frequency.exponentialRampToValueAtTime(10, time + 0.3);
        gain.gain.setValueAtTime(0.5, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.3);
        osc.start(time);
        osc.stop(time + 0.3);
    }
}

function nextNote() {
    const secondsPerBeat = 60.0 / tempo;
    nextNoteTime += 0.25 * secondsPerBeat;
    currentStep = (currentStep + 1) % 16;
}

function scheduleNote(stepNumber, time) {
    requestAnimationFrame(() => {
        document.querySelectorAll('.step.playing').forEach(s => s.classList.remove('playing'));
        document.querySelectorAll(`.step[data-idx="${stepNumber}"]`).forEach(s => s.classList.add('playing'));
    });
    if (activePattern.k[stepNumber] !== '.') playSound('kick', time);
    if (activePattern.s[stepNumber] === 'x') playSound('snare', time);
    else if (activePattern.s[stepNumber] === 'r') {
        playSound('snare', time);
        playSound('snare', time + (0.125 * 60/tempo));
    }
    if (activePattern.h[stepNumber] === 'x') playSound('hat', time);
    else if (activePattern.h[stepNumber] === 'r') {
        playSound('hat', time);
        playSound('hat', time + (0.125 * 60/tempo));
    }
    if (activePattern.p[stepNumber] !== '.') playSound('perc', time);
}

function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        scheduleNote(currentStep, nextNoteTime);
        nextNote();
    }
    timerID = requestAnimationFrame(scheduler);
}

// --- MIDI Encoder ---
function exportMIDI() {
    // 1. Setup MIDI Constants
    const PPQ = 480; // Pulses Per Quarter note
    const MPQN = Math.round(60000000 / tempo); // Microseconds Per Quarter Note
    const stepTicks = PPQ / 4; // 16th note = 1/4 of a beat
    
    // 2. Collect Events
    let events = [];
    
    // Tempo Meta Event at time 0
    // FF 51 03 tttttt
    events.push({
        tick: 0,
        data: [0xFF, 0x51, 0x03, (MPQN >> 16) & 0xFF, (MPQN >> 8) & 0xFF, MPQN & 0xFF]
    });

    for (let i = 0; i < 16; i++) {
        const tickOn = i * stepTicks;
        const tickOff = tickOn + (stepTicks - 10); // Note duration slightly less than step

        // Kick
        if (activePattern.k[i] !== '.') {
            events.push({ tick: tickOn, data: [0x90, MIDI_MAP.k, 100] }); // Note On
            events.push({ tick: tickOff, data: [0x80, MIDI_MAP.k, 0] });   // Note Off
        }
        // Snare
        if (activePattern.s[i] === 'x') {
            events.push({ tick: tickOn, data: [0x90, MIDI_MAP.s, 100] });
            events.push({ tick: tickOff, data: [0x80, MIDI_MAP.s, 0] });
        } else if (activePattern.s[i] === 'r') {
            // Roll: two quick hits
            events.push({ tick: tickOn, data: [0x90, MIDI_MAP.s, 100] });
            events.push({ tick: tickOn + (stepTicks/2)-5, data: [0x80, MIDI_MAP.s, 0] });
            events.push({ tick: tickOn + (stepTicks/2), data: [0x90, MIDI_MAP.s, 100] });
            events.push({ tick: tickOff, data: [0x80, MIDI_MAP.s, 0] });
        }
        // Hat
        if (activePattern.h[i] === 'x') {
            events.push({ tick: tickOn, data: [0x90, MIDI_MAP.h, 100] });
            events.push({ tick: tickOff, data: [0x80, MIDI_MAP.h, 0] });
        } else if (activePattern.h[i] === 'r') {
            events.push({ tick: tickOn, data: [0x90, MIDI_MAP.h, 100] });
            events.push({ tick: tickOn + (stepTicks/2)-5, data: [0x80, MIDI_MAP.h, 0] });
            events.push({ tick: tickOn + (stepTicks/2), data: [0x90, MIDI_MAP.h, 100] });
            events.push({ tick: tickOff, data: [0x80, MIDI_MAP.h, 0] });
        }
        // Perc
        if (activePattern.p[i] !== '.') {
            events.push({ tick: tickOn, data: [0x90, MIDI_MAP.p, 100] });
            events.push({ tick: tickOff, data: [0x80, MIDI_MAP.p, 0] });
        }
    }

    // End of Track Event
    events.push({
        tick: 16 * stepTicks,
        data: [0xFF, 0x2F, 0x00]
    });

    // 3. Sort Events by Time
    events.sort((a, b) => a.tick - b.tick);

    // 4. Encode to Bytes
    let trackData = [];
    let prevTick = 0;

    events.forEach(e => {
        let delta = e.tick - prevTick;
        prevTick = e.tick;
        
        // Write Variable Length Quantity (delta)
        let buffer = [];
        let val = delta;
        do {
            let byte = val & 0x7F;
            val >>= 7;
            if (buffer.length > 0) byte |= 0x80;
            buffer.unshift(byte);
        } while (val > 0);
        trackData.push(...buffer);
        
        // Write Event Data
        trackData.push(...e.data);
    });

    // 5. Construct MIDI File (Header + Track)
    // Header: MThd, Len=6, Fmt=0, Trks=1, PPQ
    const header = [
        0x4D, 0x54, 0x68, 0x64, // MThd
        0x00, 0x00, 0x00, 0x06, // Length 6
        0x00, 0x00, // Format 0
        0x00, 0x01, // 1 Track
        (PPQ >> 8) & 0xFF, PPQ & 0xFF // PPQ
    ];

    // Track Header: MTrk, Length
    const trkHeader = [
        0x4D, 0x54, 0x72, 0x6B, // MTrk
        (trackData.length >> 24) & 0xFF,
        (trackData.length >> 16) & 0xFF,
        (trackData.length >> 8) & 0xFF,
        trackData.length & 0xFF
    ];

    const rawData = new Uint8Array([...header, ...trkHeader, ...trackData]);
    const blob = new Blob([rawData], { type: 'audio/midi' });
    const url = URL.createObjectURL(blob);
    
    // Download Trigger
    const a = document.createElement('a');
    a.href = url;
    a.download = `drum_pattern_${tempo}bpm.mid`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}


// --- UI Logic ---

const genreSelect = document.getElementById('genreSelect');
const patternSelect = document.getElementById('patternSelect');
const bpmInput = document.getElementById('bpmInput');
const descBox = document.getElementById('descBox');
const volSlider = document.getElementById('volSlider');

// --- MIDI Mapping Utilities ---
const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const NOTE_VALS = {
    'C': 0, 'C#': 1, 'DB': 1, 'D': 2, 'D#': 3, 'EB': 3, 'E': 4,
    'F': 5, 'F#': 6, 'GB': 6, 'G': 7, 'G#': 8, 'AB': 8, 'A': 9,
    'A#': 10, 'BB': 10, 'B': 11
};

function midiToNoteName(midi) {
    if (midi < 0 || midi > 127) return 'C4';
    const octave = Math.floor(midi / 12) - 1;
    const note = NOTES[midi % 12];
    return `${note}${octave}`;
}

function noteNameToMidi(name) {
    const match = name.trim().toUpperCase().match(/^([A-G][#B]?)(-?\d+)$/);
    if (!match) return null;
    const noteVal = NOTE_VALS[match[1]];
    if (noteVal === undefined) return null;
    const oct = parseInt(match[2], 10);
    const midi = (oct + 1) * 12 + noteVal;
    if (midi < 0 || midi > 127) return null;
    return midi;
}

// Modal Logic
const settingsModal = document.getElementById('settingsModal');
document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('map-k').value = midiToNoteName(MIDI_MAP.k);
    document.getElementById('map-s').value = midiToNoteName(MIDI_MAP.s);
    document.getElementById('map-h').value = midiToNoteName(MIDI_MAP.h);
    document.getElementById('map-p').value = midiToNoteName(MIDI_MAP.p);
    settingsModal.style.display = 'block';
});

document.getElementById('closeSettingsBtn').addEventListener('click', () => {
    settingsModal.style.display = 'none';
});

window.addEventListener('click', (event) => {
    if (event.target == settingsModal) {
        settingsModal.style.display = 'none';
    }
});

['k', 's', 'h', 'p'].forEach(inst => {
    const input = document.getElementById(`map-${inst}`);
    input.addEventListener('change', (e) => {
        const midi = noteNameToMidi(e.target.value);
        if (midi !== null) {
            MIDI_MAP[inst] = midi;
            e.target.value = midiToNoteName(midi); // Format nicely
        } else {
            e.target.value = midiToNoteName(MIDI_MAP[inst]); // Revert on error
            alert("Invalid Note Name.\nPlease use format like 'C4', 'D#2', or 'Bb1'.");
        }
    });
});

// Populate Genres
Object.keys(DATA).forEach(g => {
    const opt = document.createElement('option');
    opt.value = g;
    opt.textContent = g;
    genreSelect.appendChild(opt);
});

function updateGenre() {
    const genreName = genreSelect.value;
    const genreData = DATA[genreName];
    tempo = genreData.bpm;
    bpmInput.value = tempo; // Update input
    currentKit = genreData.kit;
    patternSelect.innerHTML = '';
    genreData.patterns.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = p.name;
        patternSelect.appendChild(opt);
    });
    loadSelectedPattern();
}

function loadSelectedPattern() {
    const genreName = genreSelect.value;
    const pIdx = patternSelect.value;
    const pattern = DATA[genreName].patterns[pIdx];
    loadPatternData(pattern);
    descBox.textContent = `[${pattern.name}] ${pattern.desc}`;
}

genreSelect.addEventListener('change', updateGenre);
patternSelect.addEventListener('change', loadSelectedPattern);

// Volume Control
volSlider.addEventListener('input', function() {
    if (masterGainNode) {
        masterGainNode.gain.value = this.value;
    }
});

// BPM Control
bpmInput.addEventListener('change', function() {
    let val = parseInt(this.value);
    if (val < 40) val = 40;
    if (val > 300) val = 300;
    tempo = val;
});

const playBtn = document.getElementById('playBtn');
playBtn.addEventListener('click', () => {
    initAudio(); // Ensure audio starts on user gesture
    if (isPlaying) {
        isPlaying = false;
        playBtn.textContent = "PLAY";
        playBtn.classList.remove('playing');
        window.cancelAnimationFrame(timerID);
        document.querySelectorAll('.step.playing').forEach(s => s.classList.remove('playing'));
    } else {
        isPlaying = true;
        playBtn.textContent = "STOP";
        playBtn.classList.add('playing');
        currentStep = 0;
        nextNoteTime = audioCtx.currentTime + 0.1;
        scheduler();
    }
});

document.getElementById('midiBtn').addEventListener('click', exportMIDI);

initGrid();
updateGenre();

</script>
